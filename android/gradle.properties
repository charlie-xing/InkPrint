org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
ANDROID_NDK_HOME=/opt/homebrew/share/android-ndk

# ── Release signing ──────────────────────────────────────────────────────────
# Do NOT put real values here — this file is committed. Set them in
# ~/.gradle/gradle.properties (not in the repo) or export them as env vars:
#
#   INKPRINT_STORE_FILE=/absolute/path/to/inkprint-release.jks
#   INKPRINT_STORE_PASSWORD=...
#   INKPRINT_KEY_ALIAS=inkprint
#   INKPRINT_KEY_PASSWORD=...
#
# When INKPRINT_STORE_FILE is unset or missing, release builds stay unsigned.
