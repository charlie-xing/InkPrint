[package]
name = "inkprint-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["charlie-xing <xjohn1666@gmail.com>"]

[lib]
name = "inkprint_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["epub"]
# PDF -> EPUB conversion (the "InkPrint EPUB" printer). Off for the F-Droid
# build, which cannot ship the prebuilt pdfium / ONNX Runtime libraries.
epub = ["dep:inkprint-epub"]

[dependencies]
inkprint-epub = { path = "../inkprint-epub", optional = true }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
mdns-sd = "0.11"
uniffi = { version = "0.28", features = ["tokio"] }
bytes = "1"
chrono = "0.4"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
thiserror = "2"
once_cell = "1"
log = "0.4"
if-addrs = "0.13"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
tracing-log = "0.2"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking"] }
